<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1419"/>
      <stop offset="100%" stop-color="#1b222b"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1f2f5"/>
      <stop offset="35%" stop-color="#d7d9df"/>
      <stop offset="70%" stop-color="#a3a9b3"/>
      <stop offset="100%" stop-color="#edf0f5"/>
    </linearGradient>
    <linearGradient id="silverDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#aab0ba"/>
      <stop offset="100%" stop-color="#6f7681"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#b7c1cf" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="docClipLeft">
      <path d="M114 249c0-24 19-43 43-43h275l98 98v333c0 24-19 43-43 43H157c-24 0-43-19-43-43V249z"/>
    </clipPath>
    <clipPath id="docClipCenter">
      <path d="M333 442c0-24 19-43 43-43h249l98 98v259c0 24-19 43-43 43H376c-24 0-43-19-43-43V442z"/>
    </clipPath>
  </defs>

  <!-- background -->
  <rect x="22" y="22" width="980" height="980" rx="108" fill="url(#bgGrad)"/>
  <rect x="22" y="22" width="980" height="980" rx="108" fill="none" stroke="#28313b" stroke-width="4"/>

  <!-- back document -->
  <g filter="url(#shadow)">
    <path d="M114 249c0-24 19-43 43-43h275l98 98v333c0 24-19 43-43 43H157c-24 0-43-19-43-43V249z" fill="url(#silver)"/>
    <path d="M432 206v55c0 24 19 43 43 43h55" fill="none" stroke="#8a909a" stroke-width="7"/>
    <path d="M432 206l98 98h-55c-24 0-43-19-43-43z" fill="#d4d7de"/>
    <g clip-path="url(#docClipLeft)" opacity="0.82">
      <rect x="150" y="353" width="240" height="24" rx="12" fill="#7c838e"/>
      <rect x="150" y="446" width="285" height="24" rx="12" fill="#7c838e"/>
      <rect x="150" y="539" width="230" height="24" rx="12" fill="#7c838e"/>
      <rect x="150" y="632" width="272" height="24" rx="12" fill="#7c838e"/>
    </g>
  </g>

  <!-- cloud -->
  <g filter="url(#shadow)">
    <path d="M640 187c92 0 167 64 182 149 15-7 31-10 48-10 71 0 129 58 129 129 0 53-33 101-80 121H598c-91 0-164-73-164-164 0-85 65-154 148-163 13-38 34-62 58-62z" fill="url(#silver)"/>
  </g>

  <!-- front document inside lens -->
  <g filter="url(#shadow)">
    <path d="M333 442c0-24 19-43 43-43h249l98 98v259c0 24-19 43-43 43H376c-24 0-43-19-43-43V442z" fill="url(#silver)"/>
    <path d="M625 399v55c0 24 19 43 43 43h55" fill="none" stroke="#8a909a" stroke-width="7"/>
    <path d="M625 399l98 98h-55c-24 0-43-19-43-43z" fill="#d4d7de"/>
    <g clip-path="url(#docClipCenter)">
      <rect x="407" y="539" width="190" height="22" rx="11" fill="#7c838e"/>
      <rect x="407" y="632" width="250" height="22" rx="11" fill="#7c838e"/>
      <rect x="407" y="725" width="220" height="22" rx="11" fill="#7c838e"/>
    </g>
  </g>

  <!-- subtle glass highlight -->
  <path d="M392 382c91-58 229-62 316-8" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="24" stroke-linecap="round"/>
  <path d="M357 457v202" fill="none" stroke="#ffffff" stroke-opacity="0.19" stroke-width="20" stroke-linecap="round"/>

  <!-- magnifier ring + handle (foreground, on top of everything) -->
  <g filter="url(#shadow)">
    <circle cx="557" cy="565" r="254" fill="none" stroke="url(#silver)" stroke-width="40"/>
    <path d="M742 749l50 50" stroke="#737b86" stroke-width="18" stroke-linecap="round"/>
    <g transform="rotate(45 823 832)">
      <rect x="760" y="774" width="180" height="116" rx="28" fill="url(#silver)" stroke="#7c828c" stroke-width="4"/>
    </g>
  </g>
</svg>
